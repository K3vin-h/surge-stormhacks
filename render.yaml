services:
  - type: web
    name: surge
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python to match local (deps tested on 3.11).
      - key: PYTHON_VERSION
        value: 3.11.9
      # --- Snowflake (non-secret infra values; auth needs the private key) ---
      - key: SNOWFLAKE_ACCOUNT
        value: JZYUUDE-DNB13567
      - key: SNOWFLAKE_USER
        value: aw1809
      - key: SNOWFLAKE_WAREHOUSE
        value: STORM_WH
      - key: SNOWFLAKE_DATABASE
        value: STORM_DB
      - key: SNOWFLAKE_SCHEMA
        value: PUBLIC
      - key: SNOWFLAKE_ROLE
        value: ACCOUNTADMIN
      # Private key is uploaded as a Render Secret File (mounted here).
      - key: SNOWFLAKE_PRIVATE_KEY_PATH
        value: /etc/secrets/rsa_key.p8
      # --- Secrets: set these in the Render dashboard (never committed) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
