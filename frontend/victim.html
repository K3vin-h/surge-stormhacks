<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1511" />
  <title>SURGE — Resident</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="theme.css?v=brand6" />
  <style>
    html, body { height: 100%; }
    body { background: #0a110d; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    .app {
      position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
      width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto;
    }
    @media (min-width: 481px) { .app { box-shadow: 0 0 0 1px #2c3626, 0 0 60px rgba(0, 0, 0, .5); } }

    .app-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 16px 12px; color: #e3e6da;
      background: #0d1511; border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    .app-head .brand { display: flex; align-items: center; gap: 10px; padding: 0; }
    .app-head .brand .emblem { width: 32px; height: 32px; }
    .app-head .name { font-size: 18px; color: #f2f1e8; display: flex; align-items: center; }
    .bell {
      position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); color: #e3e6da;
    }
    .bell .ndot, .tabbar .ndot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: #d39a3e; box-shadow: 0 0 0 2px #0d1511; }
    .ndot[hidden] { display: none; }

    .screen { position: relative; flex: 1; min-height: 0; }
    .tab { position: absolute; inset: 0; overflow-y: auto; padding: 16px 18px 28px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .tab[hidden] { display: none; }

    .tabbar {
      flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line);
    }
    .tabbar button {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 6px;
      border: none; border-radius: 12px; background: none; color: var(--muted); font-size: 11px; font-weight: 500;
    }
    .tabbar button.active { color: var(--ink); font-weight: 650; }
    .tabbar button.active::before {
      content: ""; position: absolute; top: 0; width: 18px; height: 3px; border-radius: 2px; background: var(--brand-sage);
    }
    .tabbar button:focus-visible { outline: 2px solid var(--brand-sage); outline-offset: -2px; }
    .tabbar .ndot { top: 6px; right: calc(50% - 16px); background: var(--red); box-shadow: 0 0 0 2px var(--surface); }

    /* Home */
    .home-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .home-bar .pill { flex: none; margin-top: 2px; }
    .greet { color: var(--muted); margin: 0; font-size: 12.5px; }
    .area-card { position: relative; z-index: 5; min-width: 0; padding: 0; }
    .area-card .val { position: relative; min-width: 0; }
    .area-open {
      display: inline-flex; align-items: baseline; gap: 8px; max-width: 100%; min-width: 0;
      margin: 0; padding: 0; border: none; background: none; cursor: pointer; color: inherit;
      font: inherit; font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; text-align: left;
    }
    .area-open:focus-visible { outline: 2px solid var(--brand-sage); outline-offset: 4px; border-radius: 8px; }
    #areaName { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .area-card .change { display: inline-flex; align-items: center; gap: 2px; flex: none; font-size: 13px; font-weight: 600; color: var(--forest-3); }
    .area-card.open .change { color: var(--ink); }
    .area-card .change svg { transition: transform .15s; }
    .area-card.open .change svg { transform: rotate(180deg); }
    .area-menu {
      position: absolute; z-index: 6; top: calc(100% + 8px); left: 0; min-width: 228px; margin: 0; padding: 6px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg);
    }
    .area-menu[hidden] { display: none; }
    .area-menu button {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%;
      border: none; background: transparent; color: var(--ink); border-radius: 11px;
      padding: 10px 12px; font: inherit; font-size: 14.5px; font-weight: 600; text-align: left; cursor: pointer;
    }
    .area-menu button .tick { display: none; color: var(--sage-ink); }
    .area-menu button[aria-selected="true"] { background: var(--sage); }
    .area-menu button[aria-selected="true"] .tick { display: inline-flex; }
    .area-menu button:hover, .area-menu button:focus-visible { background: var(--surface-3); outline: none; }
    .area-menu button[aria-selected="true"]:hover, .area-menu button[aria-selected="true"]:focus-visible { background: var(--sage); }
    .area-hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .area-card.needs-pick { background: var(--amber-soft); border: 1px solid var(--amber-2); border-radius: 14px; padding: 8px 12px; }
    .area-card.needs-pick .area-hint { color: var(--amber); font-weight: 600; }
    .inst {
      position: relative; overflow: hidden; border-radius: 22px; padding: 18px 18px 14px 20px;
      color: #f2f1e8; box-shadow: var(--shadow-lg);
      background: linear-gradient(165deg, rgba(31, 49, 37, .88), rgba(20, 32, 25, .72)), url("assets/brand/hero-dark.jpg") 0% 100% / 420% auto no-repeat, #1f3125;
    }
    .inst::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--amber-2); }
    .inst.clear::before { background: var(--brand-sage-2); }
    .inst.none { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .inst.none::before { background: var(--line-2); }
    .inst-top { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .inst-top span:first-child { display: flex; align-items: center; gap: 8px; opacity: .9; }
    .inst-cur { font-size: 10.5px; letter-spacing: .04em; padding: 5px 10px; border-radius: 999px; background: rgba(255, 255, 255, .14); }
    .inst h2 { font-size: 32px; margin: 14px 0 6px; letter-spacing: -0.03em; }
    .inst p { margin: 0; font-size: 15px; line-height: 1.5; opacity: .92; }
    .inst-go { margin-top: 14px; display: grid; gap: 8px; }
    .inst-go div { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .08); font-size: 13px; }
    .inst-go b { display: block; }
    .inst-go small { opacity: .7; }
    .inst-foot { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; opacity: .85; }
    .listen {
      display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); color: inherit;
    }
    .inst.none .listen, .alert-card .listen { background: var(--surface-2); border-color: var(--line-2); color: var(--forest-2); }
    .status-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
    .status-line b { color: var(--ink); font-weight: 650; }
    .sec-title { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
    .sec-title h3 { font-size: 17px; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .act {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line);
      background: var(--surface); text-align: left; font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow);
    }
    .act .ai { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
    .act small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
    .act.sos { grid-column: 1 / -1; background: var(--red); border-color: var(--red); color: #fff; }
    .act.sos .ai { background: rgba(255, 255, 255, .16); }
    .act.sos small { color: rgba(255, 255, 255, .8); }
    .act:disabled { opacity: .6; }
    #reportMsg { margin-top: 10px; font-size: 13px; }
    .ask {
      margin-top: 22px; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; border-radius: 18px;
      background: var(--forest-2); color: #eef0e7; border: none; box-shadow: var(--shadow-lg);
    }
    .ask .ai { width: 42px; height: 42px; border-radius: 14px; background: rgba(255, 255, 255, .1); display: grid; place-items: center; }
    .ask b { display: block; font-size: 15px; }
    .ask small { opacity: .75; }

    /* Rasuwa client-side routing panel */
    .rz { position: absolute; z-index: 600; left: 12px; right: 12px; top: 84px; display: grid; gap: 8px; pointer-events: none; }
    .rz > * { pointer-events: auto; }
    .rz-banner { display: flex; gap: 8px; align-items: flex-start; background: var(--red); color: #fff; border-radius: 12px; padding: 10px 12px; font-weight: 600; box-shadow: var(--shadow); }
    .rz-banner[hidden], .rz[hidden] { display: none; }
    .rz-banner span { flex: 1; }
    .rz-banner button { background: none; border: 0; color: #fff; font-size: 20px; line-height: 1; cursor: pointer; }
    .rz-card { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 13.5px; }
    .rz-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .rz-row button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; }
    .rz-row button[hidden] { display: none; }
    .rz-row button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
    .rz button:focus-visible { outline: 2px solid var(--brand-sage); outline-offset: 2px; }
    .rz small { display: block; margin-top: 8px; color: var(--muted); font-size: 11.5px; }

    /* Map tab */
    #tab-map { padding: 0; overflow: hidden; }
    #map { position: absolute; inset: 0; z-index: 0; }
    .attrib { font-size: 10.5px; color: var(--muted); text-align: center; padding-top: 10px; }
    #tab-map .map-toggles { position: absolute; z-index: 500; left: 12px; right: 64px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .map-toggles button {
      border: 1px solid transparent; background: rgba(251, 250, 245, .95); box-shadow: var(--shadow);
      border-radius: 999px; padding: 6px 10px; font-size: 11.5px; font-weight: 650; color: var(--muted);
    }
    .map-toggles button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); }
    .map-toggles button:focus-visible { outline: 2px solid var(--brand-sage); outline-offset: 2px; }
    .locate { position: absolute; right: 12px; top: 12px; z-index: 500; width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 600; background: var(--surface); border-radius: 26px 26px 0 0;
      box-shadow: 0 -12px 30px -12px rgba(0, 0, 0, .25); padding: 10px 20px 16px; max-height: 52%; overflow-y: auto; transition: max-height .25s;
    }
    .sheet.collapsed { max-height: none; overflow: hidden; }
    .sheet.collapsed .sh-item, .sheet.collapsed .attrib { display: none; }
    .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 14px; border: none; display: block; padding: 0; }
    .sh-route { display: flex; gap: 14px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .sh-ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none; }
    .sh-route .eyebrow { font-size: 10px; color: var(--muted); font-weight: 500; }
    .sh-route b { display: block; font-size: 17px; margin: 2px 0; }
    .sh-item { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .sh-item:last-child { border-bottom: none; }
    .sh-item .pi { width: 30px; height: 30px; flex: none; }
    .sh-item .map-pin { width: 30px !important; height: 30px !important; border-width: 2px; box-shadow: none; }
    .sh-item small { display: block; color: var(--muted); font-size: 11.5px; }

    /* Alerts tab */
    .tab h2.title { font-size: 26px; margin-top: 8px; }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 14px; background: var(--surface-3); margin: 16px 0; }
    .seg button { border: none; background: none; padding: 10px; border-radius: 11px; font-weight: 500; color: var(--ink-2); }
    .seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 700; }
    .alert-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 14px 22px; margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; }
    .alert-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--forest-3); }
    .alert-card.old { background: var(--surface-2); box-shadow: none; }
    .alert-card.old::before { background: transparent; }
    .alert-card.old h3, .alert-card.old p { color: var(--muted); }
    .ac-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .ac-top b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--sage-ink); }
    .alert-card.old .ac-top b { color: var(--muted); }
    .ac-title { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; }
    .ac-title .ai { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
    .ac-title h3 { font-size: 23px; font-weight: 500; }
    .alert-card p { margin: 0; font-size: 14.5px; line-height: 1.5; }
    .ac-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

    /* Assistant tab */
    #tab-assistant { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    #tab-assistant[hidden] { display: none; }
    .as-head { padding: 14px 18px 4px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .as-head h2 { font-size: 20px; margin-top: 2px; }
    .chat { flex: 1; overflow-y: auto; padding: 4px 20px 12px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { max-width: 86%; padding: 11px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .bubble .who { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .65; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .b-user { align-self: flex-end; background: var(--forest-2); color: #f2f3ec; border-bottom-right-radius: 6px; }
    .b-agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
    .b-gov { align-self: stretch; max-width: none; background: var(--amber-soft); border-left: 4px solid var(--amber); border-radius: 12px; }
    .b-sys { align-self: center; max-width: 92%; background: var(--teal-soft); color: var(--teal); font-size: 12.5px; border-radius: 12px; text-align: center; }
    .replay { border: none; background: none; padding: 2px; color: inherit; opacity: .8; display: inline-flex; }
    .typing { align-self: flex-start; display: flex; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 18px 2px; }
    .suggest button { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--forest-2); }
    .composer { display: flex; gap: 8px; align-items: center; padding: 10px 14px 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
    .composer input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface); outline: none; font-size: 16px; }
    .composer input:focus { border-color: var(--amber-2); }
    .round { width: 46px; height: 46px; border-radius: 50%; border: none; display: grid; place-items: center; flex: none; }
    .mic { background: var(--forest-2); color: #fff; }
    .mic.recording { background: var(--red); animation: pulse 1.6s infinite; }
    .send { background: var(--amber); color: #fff; }
    #agentStatus { padding: 0 20px 6px; font-size: 12px; min-height: 0; }
  </style>
</head>
<body>
  <div class="app">
      <header class="app-head on-dark">
        <span class="brand"><span id="logo"></span><span class="name" id="wordmark"></span></span>
        <button class="bell" id="bellBtn" aria-label="Alerts"><span data-icon="bell"></span><span class="ndot" id="bellDot" hidden></span></button>
      </header>

      <main class="screen">
        <!-- HOME -->
        <section class="tab home" id="tab-home">
          <div class="home-bar">
            <div class="area-card" id="areaCard">
              <div class="greet" id="greet">Hello</div>
              <div class="val">
                <button type="button" class="area-open" id="areaBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="areaMenu">
                  <span id="areaName">—</span><span class="change">Change<span data-icon="chevronDown"></span></span>
                </button>
                <div class="area-menu" id="areaMenu" role="listbox" aria-label="Your area" hidden></div>
              </div>
              <div class="area-hint" id="areaHint"></div>
            </div>
            <span class="pill tone-amber"><i class="dot"></i>Demo</span>
          </div>

          <div id="instCard" class="inst none"><p>Loading official instruction…</p></div>

          <div class="status-line"><span id="riskMeta">—</span><span>Next update <b id="nextMeta">—</b></span></div>

          <div class="sec-title"><h3>Report to authorities</h3><span class="small muted">Shares your location</span></div>
          <div class="acts" id="acts">
            <button class="act sos" data-kind="rescue_needed"><span class="ai" data-icon="sos"></span><span>I’m trapped — need rescue<small>Sends an SOS pin to emergency operations</small></span></button>
            <button class="act" data-kind="road_hazard"><span class="ai tone-orange" data-icon="road"></span><span>Road blocked<small>Flooded or closed</small></span></button>
            <button class="act" data-kind="rescue_seen"><span class="ai tone-violet" data-icon="eye"></span><span>Saw someone<small>Needs help nearby</small></span></button>
          </div>
          <div id="reportMsg"></div>

          <button class="ask" id="askBtn"><span class="ai" data-icon="chat"></span><span style="flex:1"><b>Ask the relief assistant</b><small>Speak or type in any language</small></span><span data-icon="chevronRight"></span></button>
        </section>

        <!-- MAP -->
        <section class="tab" id="tab-map" hidden>
          <div id="map"></div>
          <div class="map-toggles" id="legendSlot"></div>
          <div class="rz" id="rzPanel" hidden>
            <div class="rz-banner" id="rzBanner" role="alert" hidden><span id="rzBannerText"></span><button type="button" id="rzBannerX" aria-label="Dismiss">&times;</button></div>
            <div class="rz-card">
              <div id="rzStatus" role="status" aria-live="polite"></div>
              <div class="rz-row">
                <button type="button" data-rz-mode="walking" aria-pressed="true">Walking</button>
                <button type="button" data-rz-mode="vehicle" aria-pressed="false">Vehicle</button>
                <button type="button" id="rzRetry" hidden>Retry</button>
              </div>
              <small>Simulated data. Routes are not a guarantee of safety; follow local authorities.</small>
            </div>
          </div>
          <button class="locate" id="locateBtn" aria-label="Show my location"><span data-icon="locate"></span></button>
          <div class="sheet collapsed" id="sheet">
            <button class="grab" id="grab" aria-label="Expand details"></button>
            <div id="sheetBody"></div>
            <div class="attrib">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></div>
          </div>
        </section>

        <!-- ALERTS -->
        <section class="tab" id="tab-alerts" hidden>
          <div class="eyebrow" id="alertsArea">—</div>
          <h2 class="title">Official alerts</h2>
          <div class="seg" id="alSeg">
            <button class="active" data-f="all">All</button>
            <button data-f="current">Current</button>
            <button data-f="past">Past</button>
          </div>
          <div id="alertList"><div class="empty">Loading alerts…</div></div>
        </section>

        <!-- ASSISTANT -->
        <section class="tab" id="tab-assistant" hidden>
          <div class="as-head">
            <div><div class="eyebrow">Relief assistant</div><h2>How can we help?</h2></div>
            <span class="pill tone-neutral" id="langBadge"><span data-icon="globe"></span>Auto</span>
          </div>
          <div class="suggest" id="suggest">
            <button data-q="Summarize the situation and my next actions." data-who="You (briefing)"><span data-icon="volume"></span>Hear briefing</button>
            <button data-q="Where should I go, and which route is approved?">Where do I go?</button>
            <button data-q="Which roads should I avoid right now?">Roads to avoid</button>
          </div>
          <div class="chat" id="chat"></div>
          <div id="agentStatus" class="muted" role="status" aria-live="polite"></div>
          <div class="composer">
            <button class="round mic" id="callBtn" aria-label="Start live call" aria-pressed="false"><span data-icon="mic"></span></button>
            <input id="q" type="text" placeholder="Ask in any language…" autocomplete="off" />
            <button class="round send" id="sendBtn" aria-label="Send"><span data-icon="send"></span></button>
          </div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar">
        <button data-tab="home" class="active"><span data-icon="home"></span>Home</button>
        <button data-tab="map"><span data-icon="map"></span>Map</button>
        <button data-tab="alerts"><span data-icon="alert"></span>Alerts<span class="ndot" id="tabDot" hidden></span></button>
        <button data-tab="assistant"><span data-icon="chat"></span>Assistant</button>
      </nav>
  </div>

  <script src="common.js?v=brand6"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let current = "sunsari";
    let tab = "home";
    let map, mapGroups = {}, myLoc = null, lastResponseId = null;
    let status = null, mapData = null, mapSig = "", needsFit = true, alertFilter = "all";
    // Tracks the instruction id the user has already been briefed on.
    // undefined = not yet baselined (first poll sets it silently).
    let lastSeenInstructionId;
    // Detected language of the caller (BCP-47); keeps replies + briefings in it.
    let userLang = null;

    document.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon, el.closest(".tabbar") ? 22 : 18); });
    $("logo").innerHTML = LOGO_SVG;
    $("wordmark").innerHTML = wordmark();

    function tickClock() {
      const h = new Date().getHours();
      $("greet").textContent = h < 5 ? "Good evening" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
    }

    // ---- Tabs ----
    function showTab(name) {
      tab = name;
      document.querySelectorAll(".tab").forEach((t) => { t.hidden = t.id !== "tab-" + name; });
      document.querySelectorAll("#tabbar button").forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
      if (name === "map" && map) setTimeout(() => { map.invalidateSize(); if (needsFit) fitMap(); }, 0);
      if (name === "alerts") { setUnseen(false); loadAlerts(); }
      if (name === "assistant") setTimeout(() => { $("chat").scrollTop = $("chat").scrollHeight; }, 0);
    }
    document.querySelectorAll("#tabbar button").forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
    $("bellBtn").onclick = () => showTab("alerts");
    $("askBtn").onclick = () => { showTab("assistant"); $("q").focus(); };

    function setUnseen(on) { $("bellDot").hidden = !on; $("tabDot").hidden = !on; }

    // ---- Area ----
    const areaBtn = $("areaBtn");
    const areaMenu = $("areaMenu");
    $("areaName").textContent = AREA_LABELS[current];
    areaMenu.innerHTML = AREAS.map((a) =>
      `<button type="button" role="option" data-area="${a}">${esc(AREA_LABELS[a])}<span class="tick">${icon("check", 16)}</span></button>`
    ).join("");
    let areaManual = false;

    function syncAreaMenu() {
      areaMenu.querySelectorAll("[data-area]").forEach((item) => {
        item.setAttribute("aria-selected", item.dataset.area === current ? "true" : "false");
      });
    }
    function closeAreaMenu() {
      areaMenu.hidden = true;
      areaBtn.setAttribute("aria-expanded", "false");
      $("areaCard").classList.remove("open");
    }
    function openAreaMenu() {
      syncAreaMenu();
      areaMenu.hidden = false;
      areaBtn.setAttribute("aria-expanded", "true");
      $("areaCard").classList.add("open");
      const selected = areaMenu.querySelector('[aria-selected="true"]');
      if (selected) selected.focus();
    }
    syncAreaMenu();

    function setAreaHint(reason) {
      $("areaHint").textContent = AREA_HINTS[reason];
      $("areaCard").classList.toggle("needs-pick", reason === "outside" || reason === "unavailable");
    }

    function setArea(areaId) {
      if (areaId === current) return;
      current = areaId;
      syncAreaMenu();
      $("areaName").textContent = AREA_LABELS[current];
      lastSeenInstructionId = undefined; // rebaseline for the new area
      mapSig = "";
      needsFit = true;
      map.setView(AREA_CENTERS[current], 12);
      if (current === "rasuwa") rzEnter(); else rzLeave();
      refresh();
      if (tab === "alerts") loadAlerts();
    }

    areaBtn.onclick = () => (areaMenu.hidden ? openAreaMenu() : closeAreaMenu());
    areaBtn.onkeydown = (e) => {
      if ((e.key === "ArrowDown" || e.key === "ArrowUp") && areaMenu.hidden) {
        e.preventDefault();
        openAreaMenu();
      }
    };
    areaMenu.onclick = (e) => {
      const item = e.target.closest("[data-area]");
      if (!item) return;
      if (item.dataset.area !== current) {
        areaManual = true;
        setAreaHint("manual");
        setArea(item.dataset.area);
      }
      closeAreaMenu();
      areaBtn.focus();
    };
    areaMenu.onkeydown = (e) => {
      const items = [...areaMenu.querySelectorAll("[data-area]")];
      const index = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const step = e.key === "ArrowDown" ? 1 : -1;
        items[(index + step + items.length) % items.length].focus();
      } else if (e.key === "Escape") {
        e.preventDefault();
        closeAreaMenu();
        areaBtn.focus();
      }
    };
    document.addEventListener("click", (e) => {
      if (!$("areaCard").contains(e.target)) closeAreaMenu();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !areaMenu.hidden) closeAreaMenu();
    });

    // ---- Home: instruction card ----
    function renderHome() {
      const card = $("instCard");
      const inst = status.instruction;
      const risk = riskInfo(status.summary.risk_level);
      const scored = typeof status.summary.risk_score === "number" && risk.label !== "Risk data unavailable";
      $("riskMeta").innerHTML = pill(scored ? `${risk.label} · ${Math.round(status.summary.risk_score * 100)}/100` : risk.label, risk.tone);
      $("nextMeta").textContent = inst && inst.next_update_at ? fmtClock(inst.next_update_at) : "when issued";
      if (!inst) {
        card.className = "inst none";
        card.innerHTML = `<div class="inst-top"><span>${icon("broadcast", 16)}Official instruction</span></div>
          <h2 style="font-size:24px">No instruction yet</h2>
          <p class="muted">No official instruction has been issued for ${esc(status.name)}. Stay alert, keep your phone charged and monitor updates.</p>`;
        return;
      }
      const info = instructionInfo(inst.instruction_type);
      card.className = "inst" + (inst.instruction_type === "all_clear" ? " clear" : "");
      let go = "";
      if (inst.instruction_type === "evacuate" && (inst.shelter || inst.approved_route)) {
        go += `<div>${icon("home", 18)}<span><small>Go to</small><b>${esc(inst.shelter ? inst.shelter.name : "Designated shelter")}</b>${inst.approved_route ? `<small>Via ${esc(inst.approved_route.name)}</small>` : ""}</span></div>`;
      }
      if (inst.roads_to_avoid && inst.roads_to_avoid.length) {
        go += `<div>${icon("x", 18)}<span><small>Avoid</small><b>${esc(inst.roads_to_avoid.map((r) => r.name).join(", "))}</b></span></div>`;
      }
      card.innerHTML = `
        <div class="inst-top"><span>${icon("broadcast", 16)}Official instruction</span><span class="inst-cur">Current</span></div>
        <h2>${esc(info.label)}</h2>
        <p>${esc(inst.emergency_message)}</p>
        ${go ? `<div class="inst-go">${go}</div>` : ""}
        <div class="inst-foot"><span>Published ${esc(fmtWhen(inst.published_at).toLowerCase())}</span>
          <button class="listen" data-inst="${esc(inst.publication_id)}">${icon("volume", 15)}Listen</button></div>`;
      bindListen(card);
    }

    function bindListen(root) {
      root.querySelectorAll("[data-inst]").forEach((b) => {
        b.onclick = () => playTts({ kind: "instruction", instruction_id: b.dataset.inst }, b);
      });
    }

    // ---- Rasuwa: client-side routing (loaded only while the Rasuwa area is selected) ----
    const RZ_NO_ROUTE = "No safe mapped route found. Contact your local emergency authority.";
    const RZ = { on: false, epoch: 0, lib: null, data: null, feats: null, mode: "walking", roads: [], roadsStale: false, roadsLoaded: false, roadsAt: 0, pollSeq: 0, routeKey: "",
      point: null, planPoint: null, plan: null, geoErr: null, watch: null, timer: null, layer: null, roadLayer: null, notice: "" };
    const rzDist = (m) => (m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`);
    const rzName = (id) => (RZ.feats && RZ.feats.get(id) && RZ.feats.get(id).properties.name) || id;

    const RZ_NO_ROADS = "Road closure information unavailable. This route may use closed or flooded roads.";
    const rzAge = (at) => { const m = Math.max(0, Math.round((Date.now() - at) / 60000)); return m < 1 ? "under a minute" : m < 60 ? `${m} min` : `${Math.round(m / 60)} h`; };
    function rzStored() {
      try { const v = JSON.parse(localStorage.getItem("rz.roads")); return v && Array.isArray(v.roads) && Number.isFinite(v.at) ? v : null; } catch (_) { return null; }
    }
    function rzStore(roads, at) { try { localStorage.setItem("rz.roads", JSON.stringify({ at, roads })); } catch (_) {} }
    // Identical text is never re-shown after the resident dismissed it (RZ.notice stays set; only "" resets).
    function rzNotice(text) {
      if (text === RZ.notice) return;
      RZ.notice = text;
      $("rzBannerText").textContent = text;
      $("rzBanner").hidden = !text;
    }
    function rzRoadsBanner() {
      if (!RZ.roadsLoaded && RZ.roadsStale) rzNotice(RZ_NO_ROADS);
      else if (RZ.notice === RZ_NO_ROADS) rzNotice("");
    }
    function rzStatus(text, retry) {
      $("rzStatus").textContent = text;
      $("rzRetry").hidden = !retry;
    }

    function rzEnter() {
      if (RZ.on) return;
      RZ.on = true;
      const epoch = ++RZ.epoch;
      RZ.layer = L.layerGroup().addTo(map);
      RZ.roadLayer = L.layerGroup().addTo(map);
      $("rzPanel").hidden = false;
      const saved = RZ.roadsLoaded ? null : rzStored();
      if (saved) { RZ.roads = saved.roads; RZ.roadsAt = saved.at; RZ.roadsLoaded = true; }
      RZ.timer = setInterval(() => { if (!document.hidden) rzPollRoads(); }, 15000);
      rzLoad(epoch);
      rzPollRoads();
    }
    function rzLeave() {
      if (!RZ.on) return;
      RZ.on = false;
      RZ.epoch++;
      clearInterval(RZ.timer);
      if (RZ.watch != null) navigator.geolocation.clearWatch(RZ.watch);
      Object.assign(RZ, { timer: null, watch: null, plan: null, planPoint: null, point: null, geoErr: null, roadsStale: false, routeKey: "" });
      rzNotice("");
      map.removeLayer(RZ.layer);
      map.removeLayer(RZ.roadLayer);
      $("rzPanel").hidden = true;
    }

    async function rzLoad(epoch) {
      rzStatus("Loading Rasuwa map data (about 1.5 MB)…", false);
      let loaded = false;
      try {
        const [lib, data] = await Promise.all([
          RZ.lib || import("/rasuwa/resident-route.js"),
          RZ.data || fetch("/rasuwa/data/prepared.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        ]);
        if (epoch !== RZ.epoch) return;
        RZ.lib = lib; RZ.data = data;
        loaded = true;
        RZ.feats = new Map(data.map.roads.features.map((f) => [f.id, f]));
        rzDrawRoads();
        rzStartWatch();
        rzCompute();
      } catch (_) {
        if (epoch === RZ.epoch) rzStatus(loaded ? "Rasuwa routing could not start. Contact your local emergency authority." : "Could not load Rasuwa map data. Check your connection.", !loaded);
      }
    }

    function rzStartWatch() {
      if (RZ.watch != null) return;
      if (!navigator.geolocation) { RZ.geoErr = "unsupported"; return rzCompute(); }
      RZ.geoErr = null;
      RZ.watch = navigator.geolocation.watchPosition((p) => {
        RZ.geoErr = null;
        myLoc = { lat: p.coords.latitude, lng: p.coords.longitude };
        const pt = [myLoc.lng, myLoc.lat];
        const move = RZ.lib.shouldRecompute(RZ.planPoint, pt);
        RZ.point = pt;
        if (move) rzCompute();
        if (mapData) drawMap();
      }, (e) => {
        RZ.geoErr = e.code === 1 ? "denied" : "unavailable";
        if (!RZ.point) rzCompute();
      }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
    }

    function rzCompute() {
      if (!RZ.on) return;
      rzRoadsBanner();
      if (!RZ.lib) return;
      try {
        rzComputeRoute();
      } catch (e) {
        console.error(e);
        rzStatus("Could not update your route. Contact your local emergency authority if this continues.", false);
      }
    }

    function rzComputeRoute() {
      const plan = RZ.lib.planRoute(RZ.data, { point: RZ.point, mode: RZ.mode, blocked: RZ.roads.map((r) => r.road_id), previous: RZ.plan });
      RZ.plan = plan;
      RZ.planPoint = RZ.point;
      RZ.layer.clearLayers();
      if (plan.changedBecause.length) {
        const names = plan.changedBecause.map((id) => {
          const r = RZ.roads.find((x) => x.road_id === id);
          return `${rzName(id)} is now ${r ? r.status : "closed"}`;
        }).join("; ");
        rzNotice(`Route changed: ${names}. ${plan.route ? "New route to " + plan.destination.name + "." : RZ_NO_ROUTE}`);
        toast("Route changed because of a road closure.", { error: true });
      } else if (plan.status === "no_route" && RZ.roadsLoaded) rzNotice(RZ_NO_ROUTE);
      else if (RZ.notice === RZ_NO_ROUTE && plan.status !== "no_route") rzNotice("");
      if (plan.status === "ok") {
        const line = drawRoute(RZ.layer, plan.route.geometry, `<b>${esc(plan.destination.name)}</b><br>${esc(rzDist(plan.route.distance_m))}`);
        const c = plan.destination.location.coordinates;
        L.marker([c[1], c[0]], { icon: pinIcon("shelter", 34) }).bindPopup(`<b>${esc(plan.destination.name)}</b><br>Nearest reachable shelter`).addTo(RZ.layer);
        // A reroute to the same shelter keeps route_id but changes road_ids, so key on both.
        const key = `${plan.route.route_id}|${(plan.route.road_ids || []).join(",")}`;
        if (key !== RZ.routeKey && line) {
          map.fitBounds(line.getBounds(), { paddingTopLeft: [40, 190], paddingBottomRight: [40, 190], maxZoom: 15 });
          needsFit = false; // setArea's pending area fit must not overwrite this
        }
        RZ.routeKey = key;
        const stale = RZ.roadsStale && RZ.roadsLoaded ? ` · closure updates unavailable, last known ${rzAge(RZ.roadsAt)} ago` : "";
        rzStatus(`${plan.destination.name} · ${rzDist(plan.route.distance_m)} ${RZ.mode === "walking" ? "on foot" : "by vehicle"}${stale}`, false);
      } else if (plan.status === "no_route") rzStatus(RZ_NO_ROUTE, false);
      else if (plan.status === "too_far") rzStatus("You are not near any mapped road in Rasuwa, so no route can be computed. Contact your local emergency authority.", false);
      else rzStatus(RZ.geoErr ? "Location unavailable. Allow location access to get a route." : "Finding your location…", false);
    }

    function rzDrawRoads() {
      RZ.roadLayer.clearLayers();
      if (!RZ.feats) return;
      RZ.roads.forEach((r) => {
        const f = RZ.feats.get(r.road_id);
        if (!f) return;
        const closed = r.status === "closed";
        L.polyline(f.geometry.coordinates.map((c) => [c[1], c[0]]), closed
          ? { color: "#c0392b", weight: 6, opacity: 0.95 }
          : { color: "#2563eb", weight: 6, opacity: 0.95, dashArray: "8 8" })
          .bindPopup(`<b>${esc(rzName(r.road_id))}</b><br>${closed ? "Closed — do not use" : "Flooded — avoid"}${r.note ? "<br>" + esc(r.note) : ""}`)
          .addTo(RZ.roadLayer);
      });
    }

    async function rzPollRoads() {
      const epoch = RZ.epoch, seq = ++RZ.pollSeq; // an older response must not overwrite a newer one
      try {
        const res = await api("/api/public/roads/status");
        if (epoch !== RZ.epoch || seq !== RZ.pollSeq) return;
        if (!Array.isArray(res && res.roads)) throw new Error("malformed road status"); // never wipe closures on a bad body
        const roads = res.roads;
        const sig = (rs) => JSON.stringify(rs.map((r) => [r.road_id, r.status]).sort());
        const changed = sig(roads) !== sig(RZ.roads) || RZ.roadsStale || !RZ.roadsLoaded;
        RZ.roads = roads; RZ.roadsStale = false; RZ.roadsLoaded = true; RZ.roadsAt = Date.now();
        rzStore(roads, RZ.roadsAt);
        if (changed) { rzDrawRoads(); rzCompute(); }
      } catch (_) {
        if (epoch !== RZ.epoch || seq !== RZ.pollSeq) return;
        RZ.roadsStale = true; // keep last known closures
        rzCompute();
      }
    }

    $("rzRetry").onclick = () => rzLoad(RZ.epoch);
    $("rzBannerX").onclick = () => { $("rzBanner").hidden = true; };
    document.querySelectorAll("[data-rz-mode]").forEach((b) => {
      b.onclick = () => {
        RZ.mode = b.dataset.rzMode;
        document.querySelectorAll("[data-rz-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        RZ.plan = null; // a mode switch is not a closure reroute
        rzCompute();
      };
    });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && RZ.on) rzPollRoads(); });

    // ---- Map ----
    function fitMap() {
      if (!mapData) return;
      const pts = [];
      if (mapData.approved_route && mapData.approved_route.geometry) mapData.approved_route.geometry.coordinates.forEach((c) => pts.push([c[1], c[0]]));
      if (mapData.shelter) pts.push(latLng(mapData.shelter.location));
      mapData.closed_roads.forEach((r) => pts.push(latLng(r.geometry)));
      mapData.hospitals.forEach((h) => pts.push(latLng(h.location)));
      if (myLoc) pts.push([myLoc.lat, myLoc.lng]);
      const valid = pts.filter(Boolean);
      if (valid.length > 1) map.fitBounds(valid, { paddingTopLeft: [40, 70], paddingBottomRight: [40, 190], maxZoom: 15 });
      else map.setView(AREA_CENTERS[current], 12);
      needsFit = false;
    }

    function drawMap() {
      const sig = JSON.stringify([current, mapData.current_instruction_id, mapData.reports, mapData.closed_roads, myLoc]);
      if (sig === mapSig) return;
      mapSig = sig;
      Object.values(mapGroups).forEach((g) => g.clearLayers());
      drawAreaZone(mapGroups.zone, mapData.geometry, mapData.risk_level);
      if (mapData.approved_route) drawRoute(mapGroups.route, mapData.approved_route.geometry, `<b>Approved route</b><br>${esc(mapData.approved_route.name)}`);
      const add = (group, ll, kind, popup, size) => ll && L.marker(ll, { icon: pinIcon(kind, size) }).bindPopup(popup).addTo(mapGroups[group]);
      if (mapData.shelter) add("shelter", latLng(mapData.shelter.location), "shelter", `<b>${esc(mapData.shelter.name)}</b><br>Approved shelter`, 34);
      mapData.hospitals.forEach((h) => add("hospital", latLng(h.location), "hospital", `<b>${esc(h.name)}</b><br>Hospital`));
      mapData.closed_roads.forEach((r) => add("closure", latLng(r.geometry), "closure", `<b>${esc(r.name)}</b><br>Closed — do not use`));
      mapData.reports.forEach((r) => add("report", latLng(r.location), r.kind, `<b>${esc(reportInfo(r.kind).label)}</b><br>${esc(r.message)}`, 24));
      if (myLoc) add("me", [myLoc.lat, myLoc.lng], "me", "You are here", 18);
      renderSheet();
      if (needsFit && tab === "map") fitMap();
    }

    function renderSheet() {
      const route = mapData.approved_route;
      const items = [];
      let head;
      if (route) {
        head = `<div class="sh-route"><span class="sh-ic tone-amber">${icon("arrowRight", 22)}</span>
          <span><div class="eyebrow">Approved evacuation route</div><b>${esc(route.name)}</b>
          <span class="muted small">${mapData.shelter ? "To " + esc(mapData.shelter.name) : ""}</span></span></div>`;
      } else {
        const risk = riskInfo(mapData.risk_level);
        head = `<div class="sh-route"><span class="sh-ic tone-${risk.tone}">${icon("map", 22)}</span>
          <span><div class="eyebrow">No active evacuation route</div><b>${esc(mapData.risk_level === "unknown" || !mapData.risk_level ? "Flood risk data unavailable for this area" : risk.label + " flood risk")}</b>
          <span class="muted small">Follow the current official instruction.</span></span></div>`;
      }
      if (mapData.shelter) items.push(["shelter", mapData.shelter.name, "Approved shelter"]);
      mapData.closed_roads.forEach((r) => items.push(["closure", r.name, "Closed road — avoid"]));
      mapData.hospitals.forEach((h) => items.push(["hospital", h.name, "Hospital"]));
      const counts = mapData.reports.reduce((m, r) => (m[r.kind] = (m[r.kind] || 0) + 1, m), {});
      Object.entries(counts).forEach(([k, n]) => items.push([k, `${n} ${reportInfo(k).label.toLowerCase()} report${n === 1 ? "" : "s"}`, "From residents nearby"]));
      $("sheetBody").innerHTML = head + items.map(([k, name, sub]) =>
        `<div class="sh-item"><span class="pi">${pinIcon(k, 30).options.html}</span><span><b>${esc(name)}</b><small>${esc(sub)}</small></span></div>`).join("");
    }
    $("grab").onclick = () => $("sheet").classList.toggle("collapsed");
    $("locateBtn").onclick = async () => {
      try {
        myLoc = await getLocation();
        map.setView([myLoc.lat, myLoc.lng], 14);
        if (mapData) drawMap();
      } catch (_) { toast("Location unavailable — check permissions.", { error: true }); }
    };

    // ---- Alerts ----
    let alerts = [];
    async function loadAlerts() {
      $("alertsArea").textContent = AREA_LABELS[current];
      try {
        const r = await api(`/api/public/alerts/${current}?limit=30`);
        alerts = r.alerts;
        renderAlerts();
      } catch (e) {
        $("alertList").innerHTML = `<div class="empty err">${esc(e.message)}</div>`;
      }
    }
    function renderAlerts() {
      const list = alerts.filter((a) => alertFilter === "all" || (alertFilter === "current" ? !a.superseded : a.superseded));
      $("alertList").innerHTML = list.length ? list.map((a) => {
        const info = instructionInfo(a.instruction_type);
        return `<div class="alert-card ${a.superseded ? "old" : ""}">
          <div class="ac-top"><b>${a.superseded ? "Superseded" : "Current instruction"}</b><span>${esc(fmtWhen(a.published_at))}</span></div>
          <div class="ac-title"><span class="ai tone-${info.tone}">${icon(info.icon, 20)}</span><h3>${esc(info.label)}</h3></div>
          <p>${esc(a.emergency_message)}</p>
          <div class="ac-foot"><span>${a.superseded ? "Kept for reference only." : "This instruction applies now."}</span>
            <button class="listen" data-inst="${esc(a.instruction_id)}">${icon("volume", 15)}Listen</button></div>
        </div>`;
      }).join("") : `<div class="empty">No ${alertFilter === "all" ? "" : alertFilter + " "}alerts for ${esc(AREA_LABELS[current])}.</div>`;
      bindListen($("alertList"));
    }
    $("alSeg").querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        alertFilter = b.dataset.f;
        $("alSeg").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
        renderAlerts();
      };
    });

    // ---- Polling ----
    // When the government publishes a new/changed instruction, the agent
    // automatically briefs the user on what changed and whether it affects them.
    async function autoBrief(prevId) {
      try {
        const data = await api("/api/public/update-briefing", {
          method: "POST",
          body: JSON.stringify({ area_id: current, previous_instruction_id: prevId, language: userLang || "en" }),
        });
        if (data.briefing) {
          // Pass response_id so the message gets a speaker/replay button — a
          // manual fallback if autoplay is still blocked for this update.
          addMsg("gov", "Government update", data.briefing.text, data.briefing.response_id);
          lastResponseId = data.briefing.response_id;
          playTts({ kind: "assistant_response", response_id: data.briefing.response_id });
        }
      } catch (_) {}
    }

    async function refresh() {
      const areaId = current;
      try {
        const [st, md] = await Promise.all([api(`/api/public/status/${areaId}`), api(`/api/public/map/${areaId}`)]);
        if (areaId !== current) return;
        status = st; mapData = md;
        renderHome();
        drawMap();
        const newId = status.instruction ? status.instruction.publication_id : null;
        if (lastSeenInstructionId === undefined) {
          lastSeenInstructionId = newId; // first poll: baseline silently
        } else if (newId && newId !== lastSeenInstructionId) {
          const prev = lastSeenInstructionId;
          lastSeenInstructionId = newId;
          if (tab !== "alerts") setUnseen(true); else loadAlerts();
          toast(`New official instruction: ${instructionInfo(status.instruction.instruction_type).label}`);
          autoBrief(prev); // a real government update arrived -> brief the user
        } else {
          lastSeenInstructionId = newId;
        }
      } catch (e) {
        $("agentStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`;
      }
    }

    // ---- Assistant chat + voice ----
    function updateLangBadge() {
      $("langBadge").innerHTML = icon("globe", 14) + esc(userLang ? userLang.toUpperCase() : "Auto");
    }

    function modeLabel(mode) {
      return mode === "gemini_grounded" ? "Grounded in official data" : mode === "deterministic" ? "Official guidance" : mode;
    }

    function addMsg(type, who, text, responseId) {
      const c = $("chat");
      const el = document.createElement("div");
      el.className = "bubble b-" + type;
      const replay = responseId ? `<button class="replay" title="Listen again" data-rid="${esc(responseId)}">${icon("volume", 14)}</button>` : "";
      el.innerHTML = (who ? `<div class="who"><span>${esc(who)}</span>${replay}</div>` : "") + `<div></div>`;
      el.lastChild.textContent = text;
      const rb = el.querySelector(".replay");
      if (rb) rb.onclick = () => playTts({ kind: "assistant_response", response_id: rb.dataset.rid }, rb);
      c.appendChild(el);
      c.scrollTop = c.scrollHeight;
      if (type === "gov" && tab !== "assistant") setUnseen(true);
    }

    function setThinking(on, label = "") {
      const c = $("chat");
      const t = c.querySelector(".typing");
      if (on && !t) { c.insertAdjacentHTML("beforeend", `<div class="typing"><i></i><i></i><i></i></div>`); c.scrollTop = c.scrollHeight; }
      if (!on && t) t.remove();
      $("agentStatus").textContent = label;
    }

    let audio = null, ttsPending = 0, ttsGen = 0, pendingTts = null, audioUnlocked = false, lastObjUrl = null, pendingPlaySrc = null;

    function ensureAudioEl() {
      if (!audio) audio = new Audio();
      return audio;
    }
    // Browsers block programmatic audio.play() until the page has a user
    // gesture / media engagement. Because playTts() only reaches .play() AFTER
    // awaiting the fetch, that gesture has expired — so gov updates and AI
    // replies silently fail. Unlock ONE shared element on the first interaction
    // (a tiny silent clip inside the gesture); reuse it so later auto-plays work.
    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;
      const a = ensureAudioEl();
      try {
        a.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        const p = a.play();
        if (p && p.then) p.then(() => a.pause()).catch(() => {});
      } catch (_) {}
    }
    ["pointerdown", "keydown", "touchstart"].forEach((ev) =>
      window.addEventListener(ev, unlockAudio, { once: true, passive: true }));

    // Safety net: if a clip (e.g. the first government update) was blocked by
    // autoplay before any interaction, it's queued here and plays automatically
    // on the very next tap anywhere — the user never has to hunt for a button.
    function flushPendingPlay() {
      if (!pendingPlaySrc) return;
      const src = pendingPlaySrc;
      pendingPlaySrc = null;
      const a = ensureAudioEl();
      a.src = src;
      a.play().catch(() => {});
    }
    ["pointerdown", "keydown", "touchstart"].forEach((ev) =>
      window.addEventListener(ev, flushPendingPlay, { passive: true }));

    async function playTts(payload, btn) {
      const gen = ++ttsGen;
      ttsPending++;
      pendingTts = payload;
      const original = btn ? btn.innerHTML : null;
      if (btn) btn.innerHTML = `<span class="spinner"></span>${btn.classList.contains("replay") ? "" : "Loading"}`;
      try {
        const res = await fetch("/api/tts", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        // Visible even for auto-plays (no btn): e.g. ElevenLabs quota exhausted.
        if (!res.ok) { toast("Audio isn’t available right now.", { error: true }); return; }
        const blob = await res.blob();
        if (gen !== ttsGen) return; // cancelled by barge-in / end of call / newer clip
        const a = ensureAudioEl();
        a.pause();
        if (lastObjUrl) URL.revokeObjectURL(lastObjUrl);
        lastObjUrl = URL.createObjectURL(blob);
        a.src = lastObjUrl;
        try {
          await a.play();
        } catch (_) {
          // Autoplay blocked (no gesture yet). Queue it to play on the next
          // tap anywhere, and also leave the replay button as a fallback.
          pendingPlaySrc = lastObjUrl;
          toast("Tap anywhere to hear the update.", { error: true });
        }
      } catch (_) {
      } finally {
        ttsPending--;
        if (gen === ttsGen) pendingTts = null;
        if (btn) btn.innerHTML = original;
      }
    }

    // Make sure we have a location before a turn so the agent can geo-tag an
    // auto-report. Non-blocking if the user denies.
    async function ensureLoc() {
      if (myLoc) return myLoc;
      try { myLoc = await getLocation(); } catch (_) {}
      return myLoc;
    }

    function noteAutoReport(resp) {
      if (resp.report_filed) {
        addMsg("sys", "", `Reported to government: ${reportInfo(resp.report_kind).label.toLowerCase()} pin filed at your location.`);
        refresh();
      }
    }

    function handleAgent(r, speak = true) {
      lastResponseId = r.response_id;
      userLang = r.language || userLang;
      updateLangBadge();
      addMsg("agent", `Assistant · ${modeLabel(r.mode)}`, r.text, r.response_id);
      noteAutoReport(r);
      if (speak) playTts({ kind: "assistant_response", response_id: r.response_id });
    }

    async function sendChat(question, who = "You") {
      addMsg("user", who, question);
      setThinking(true, "Assistant is thinking…");
      await ensureLoc();
      try {
        const body = { area_id: current, question, device_id: deviceId() };
        if (myLoc) { body.latitude = myLoc.lat; body.longitude = myLoc.lng; }
        if (userLang) body.language = userLang;
        body.device_id = deviceId();
        const r = await api("/api/chat", { method: "POST", body: JSON.stringify(body) });
        setThinking(false);
        handleAgent(r);
      } catch (e) {
        setThinking(false);
        $("agentStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`;
      }
    }

    $("sendBtn").onclick = () => {
      const q = $("q");
      if (q.value.trim()) { sendChat(q.value.trim()); q.value = ""; }
    };
    $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("sendBtn").click(); });
    $("suggest").querySelectorAll("button").forEach((b) => { b.onclick = () => sendChat(b.dataset.q, b.dataset.who || "You"); });

    // Live call: tap once, mic stays open. Energy-based VAD auto-sends each
    // utterance to /api/voice, the reply is spoken, then we listen again.
    // Talking over the assistant stops its audio (barge-in).
    // ponytail: RMS threshold VAD, swap for @ricky0123/vad-web if noisy rooms misfire.
    const VAD = { startRms: 0.04, bargeRms: 0.09, bargeMs: 200, silenceMs: 1000, minSpeechMs: 300, maxClipMs: 20000, tickMs: 50,
                  calibTicks: 10, noiseFactor: 3, maxStartRms: 0.08 }; // ~0.5 s ambient sample sets the thresholds
    let call = null;
    const assistantSpeaking = () => ttsPending > 0 || (audio && !audio.paused && !audio.ended);
    const clipMime = () => ["audio/webm", "audio/mp4"].find((t) => MediaRecorder.isTypeSupported(t));

    function setCallUi(on) {
      const btn = $("callBtn");
      btn.classList.toggle("recording", on);
      btn.innerHTML = icon(on ? "stop" : "mic", 18);
      btn.setAttribute("aria-label", on ? "End call" : "Start live call");
      btn.setAttribute("aria-pressed", String(on));
    }

    function endCall(msg = "") {
      if (!call) return;
      clearInterval(call.timer);
      if (call.rec && call.rec.state === "recording") { call.discard = true; call.rec.stop(); }
      call.stream.getTracks().forEach((t) => t.stop());
      call.ctx.close().catch(() => {});
      ttsGen++; // cancel any TTS still loading
      if (audio) audio.pause();
      call = null;
      setCallUi(false);
      $("agentStatus").textContent = msg;
    }

    async function sendClip(blob) {
      const c = call;
      c.busy = true;
      setThinking(true, "Transcribing…");
      await ensureLoc();
      const fd = new FormData();
      fd.append("area_id", current);
      fd.append("device_id", deviceId());
      let heard = false;
      fd.append("audio", blob, "clip." + (blob.type.includes("mp4") ? "mp4" : "webm"));
      if (myLoc) { fd.append("latitude", myLoc.lat); fd.append("longitude", myLoc.lng); }
      if (userLang) fd.append("language", userLang);
      try {
        const res = await fetch("/api/voice", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error((data.error && data.error.message) || JSON.stringify(data));
        setThinking(false);
        if (data.transcript) {
          addMsg("user", "You (voice)", data.transcript);
          handleAgent(data.response, call === c); // still file/show it, but stay silent if the call ended
        }
        heard = !!data.transcript;
      } catch (e) {
        setThinking(false);
        if (call === c) $("agentStatus").innerHTML = `<span class="err">${esc(e.message)}</span>`;
        return c.busy = false;
      }
      if (call === c) { c.busy = false; $("agentStatus").textContent = heard ? "Live — listening…" : "Live — didn’t catch that, go ahead…"; }
    }

    function beginClip(c) {
      const mimeType = clipMime();
      const rec = new MediaRecorder(c.stream, mimeType ? { mimeType } : undefined);
      const parts = [];
      rec.ondataavailable = (e) => parts.push(e.data);
      rec.onstop = () => {
        c.recording = false;
        if (c.discard || !call) return;
        const { bargedAudio, bargedTts } = c;
        c.bargedAudio = c.bargedTts = null;
        if (c.voicedMs < VAD.minSpeechMs) { // a cough or click: restore what it interrupted
          if (bargedTts) playTts(bargedTts); // a reply that was still loading
          else if (bargedAudio && bargedAudio === audio && !audio.ended) audio.play().catch(() => {});
          return;
        }
        const type = (rec.mimeType || "audio/webm").split(";")[0];
        sendClip(new Blob(parts, { type }));
      };
      rec.start();
      c.rec = rec; c.recording = true; c.voicedMs = 0; c.silentMs = 0; c.clipMs = 0;
    }

    function vadTick() {
      const c = call;
      if (!c) return;
      c.analyser.getFloatTimeDomainData(c.buf);
      let sum = 0;
      for (const v of c.buf) sum += v * v;
      const rms = Math.sqrt(sum / c.buf.length);
      if (c.calib) { // sample the room first; the median ignores a brief burst of speech
        c.calib.push(rms);
        if (c.calib.length < VAD.calibTicks) return;
        const noise = [...c.calib].sort((a, b) => a - b)[VAD.calibTicks >> 1];
        c.startRms = Math.min(VAD.maxStartRms, Math.max(VAD.startRms, noise * VAD.noiseFactor));
        c.bargeRms = Math.max(VAD.bargeRms, c.startRms * (VAD.bargeRms / VAD.startRms));
        c.calib = null;
        $("agentStatus").textContent = "Live — listening… (headphones work best)";
        return;
      }
      const speaking = assistantSpeaking();
      const loud = rms > (speaking ? c.bargeRms : c.startRms);

      if (!c.recording) {
        if (c.busy) return;
        // Over the assistant's voice, require sustained speech (echo guard) before barge-in.
        c.loudMs = loud ? (c.loudMs || 0) + VAD.tickMs : 0;
        if (!loud || (speaking && c.loudMs < VAD.bargeMs)) return;
        if (speaking) { // barge-in
          const playing = audio && !audio.paused && !audio.ended;
          c.bargedTts = ttsPending > 0 ? pendingTts : null;
          c.bargedAudio = playing ? audio : null;
          ttsGen++; // cancel a reply that is still loading
          if (playing) audio.pause();
        }
        $("agentStatus").textContent = "Live — hearing you…";
        beginClip(c);
      }
      if (c.rec.state !== "recording") return; // stop() already issued, waiting for onstop
      c.clipMs += VAD.tickMs;
      if (loud) { c.voicedMs += VAD.tickMs; c.silentMs = 0; } else { c.silentMs += VAD.tickMs; }
      if (c.silentMs >= VAD.silenceMs || c.clipMs >= VAD.maxClipMs) c.rec.stop();
    }

    $("callBtn").onclick = async () => {
      if (call) return endCall();
      // Create + resume the AudioContext inside the tap (Safari/iOS user-activation rule).
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let stream;
      try {
        ctx.resume();
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        ctx.createMediaStreamSource(stream).connect(analyser);
        call = {
          stream, ctx, analyser, buf: new Float32Array(analyser.fftSize), recording: false, busy: false,
          calib: [], startRms: VAD.startRms, bargeRms: VAD.bargeRms,
        };
        call.timer = setInterval(vadTick, VAD.tickMs);
        setCallUi(true);
        $("agentStatus").textContent = "Live — getting ready, stay quiet for a moment…";
      } catch (e) {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        ctx.close().catch(() => {});
        $("agentStatus").innerHTML = `<span class="err">Mic error: ${esc(e.message)}</span>`;
      }
    };
    // Hang up if the page is hidden so the mic never stays open in the background.
    document.addEventListener("visibilitychange", () => { if (document.hidden) endCall(); });
    window.addEventListener("pagehide", () => endCall());

    // ---- Reports ----
    const REPORT_MESSAGES = {
      road_hazard: "Road in front of me is blocked by floodwater.",
      rescue_needed: "I am trapped and need rescue.",
      rescue_seen: "I see someone stuck and needing help nearby.",
    };
    document.querySelectorAll("#acts .act").forEach((btn) => {
      btn.onclick = async () => {
        const kind = btn.dataset.kind;
        const out = $("reportMsg");
        out.innerHTML = `<span class="muted"><span class="spinner"></span> Getting your location…</span>`;
        let loc;
        try { loc = await getLocation(); myLoc = loc; }
        catch (e) { out.innerHTML = `<span class="err">Location is needed to send a report. Please allow location access.</span>`; return; }
        btn.disabled = true;
        try {
          const r = await api("/api/public/reports", {
            method: "POST",
            body: JSON.stringify({
              area_id: current, kind, message: REPORT_MESSAGES[kind],
              location: { type: "Point", coordinates: [loc.lng, loc.lat] },
              reported_at: new Date().toISOString(),
              idempotency_key: deviceId() + ":" + kind + ":" + Date.now(),
              device_id: deviceId(),
            }),
          });
          out.innerHTML = r.moved && kind === "rescue_needed"
            ? `<span class="ok">${icon("check", 14)} Your SOS location was updated. Emergency operations can see your new position.</span>`
            : `<span class="ok">${icon("check", 14)} Sent (${esc(VERIFICATION[r.verification_state] || r.verification_state)}). Emergency operations can see it now.</span>`;
          out.querySelector(".icon").style.display = "inline";
          refresh();
        } catch (e) {
          const dup = kind === "rescue_needed" && e.status === 409;
          out.innerHTML = `<span class="${dup ? "muted" : "err"}">${esc(dup ? e.detail : e.message)}</span>`;
        }
        finally { btn.disabled = false; }
      };
    });

    // ---- Boot ----
    (async function () {
      tickClock();
      setInterval(tickClock, 30000);
      map = baseMap("map", AREA_CENTERS[current], 12, { controls: false });
      mapGroups = {};
      ["route", "zone", "shelter", "hospital", "closure", "report", "me"].forEach((k) => { mapGroups[k] = L.layerGroup(); });
      const mapLayerDefaults = { route: true, zone: true, shelter: true, hospital: true, closure: true, report: true };
      const mapLayers = (() => {
        try { return { ...mapLayerDefaults, ...JSON.parse(localStorage.getItem("surge.victim.layers") || "{}") }; }
        catch { return { ...mapLayerDefaults }; }
      })();
      function applyMapLayers() {
        Object.entries(mapGroups).forEach(([k, g]) => {
          const on = k === "me" || !!mapLayers[k];
          if (on && !map.hasLayer(g)) g.addTo(map);
          if (!on && map.hasLayer(g)) map.removeLayer(g);
        });
        $("legendSlot").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", mapLayers[b.dataset.layer] ? "true" : "false"));
      }
      $("legendSlot").innerHTML = [
        ["route", "Route"], ["zone", "Risk zone"], ["closure", "Closed roads"],
        ["shelter", "Shelters"], ["hospital", "Hospitals"], ["report", "Reports"],
      ].map(([k, label]) => `<button type="button" data-layer="${k}" aria-pressed="false">${label}</button>`).join("");
      $("legendSlot").onclick = (e) => {
        const btn = e.target.closest("[data-layer]");
        if (!btn) return;
        mapLayers[btn.dataset.layer] = !mapLayers[btn.dataset.layer];
        localStorage.setItem("surge.victim.layers", JSON.stringify(mapLayers));
        applyMapLayers();
      };
      applyMapLayers();
      addMsg("agent", "Assistant", "Hi, I’m the SURGE relief assistant. I answer using the official instruction for your area. Ask me anything, in any language — or tap the microphone to talk.");
      await refresh();
      setInterval(refresh, 3000);
      // Pick the area from the device location; fall back to the dropdown.
      setAreaHint("detecting");
      detectArea().then(({ area, loc, reason }) => {
        if (loc) myLoc = loc;
        if (areaManual) return;
        setAreaHint(reason);
        if (area) setArea(area);
        if (mapData) drawMap();
      });
    })();
  </script>
</body>
</html>
