<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SURGE — Resident</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0b1220; color: #e6edf3; }
    .phone { max-width: 430px; margin: 0 auto; min-height: 100vh; border-left: 1px solid #22304a; border-right: 1px solid #22304a; }
    header { padding: 10px 14px; background: #121b2e; display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 16px; margin: 0; }
    select { margin-left: auto; background: #0b1220; color: #e6edf3; border: 1px solid #22304a; border-radius: 6px; padding: 5px; }
    .section { padding: 12px 14px; }
    .banner { border-radius: 10px; padding: 12px; margin: 12px 14px; }
    .b-critical { background: #7f1d1d; } .b-warning { background: #9a3412; }
    .b-advisory { background: #854d0e; } .b-info { background: #14532d; } .b-none { background: #1f2a3d; }
    .banner .t { font-weight: 700; font-size: 15px; }
    #map { height: 240px; margin: 0 14px; border-radius: 10px; }
    .row { display: flex; gap: 8px; }
    button { font: inherit; border: none; border-radius: 8px; padding: 10px; cursor: pointer; }
    .call { background: #22c55e; color: #042; flex: 1; font-weight: 700; }
    .call.recording { background: #ef4444; color: white; }
    .brief { background: #4b7bec; color: white; flex: 1; font-weight: 700; }
    .chatbox { background: #121b2e; border: 1px solid #22304a; border-radius: 10px; padding: 10px; min-height: 60px; }
    .msg { margin: 6px 0; } .msg .who { font-size: 11px; color: #9fb0c3; }
    .msg .txt { background: #0e1830; padding: 8px; border-radius: 8px; }
    input[type=text] { flex: 1; padding: 10px; background: #0b1220; color: #e6edf3; border: 1px solid #22304a; border-radius: 8px; }
    .report-btns button { flex: 1; font-size: 13px; }
    .r-road { background: #f59e0b; color: #222; }
    .r-sos { background: #ef4444; color: white; }
    .r-seen { background: #8b5cf6; color: white; }
    .muted { color: #6b7a90; font-size: 12px; }
    .ok { color: #4ade80; } .err { color: #f87171; }
    h3 { font-size: 13px; color: #9fb0c3; text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 8px; }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <h1>📱 SURGE</h1>
      <span id="langBadge" class="muted" style="margin-left:6px">🌐 auto</span>
      <select id="areaSelect"></select>
    </header>

    <div id="banner" class="banner b-none"><div class="t">Loading…</div></div>

    <div id="map"></div>

    <div class="section">
      <h3>Talk to the relief agent</h3>
      <div class="muted" style="margin-bottom:6px">Speak or type in any language — the agent replies in yours.</div>
      <div class="row">
        <button id="callBtn" class="call">🎙️ Tap to talk</button>
        <button id="briefBtn" class="brief">▶️ Hear briefing</button>
      </div>
      <div id="agentStatus" class="muted" style="margin-top:6px"></div>
      <div class="chatbox" id="chat" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px">
        <input id="q" type="text" placeholder="Ask the agent…" />
        <button id="sendBtn" class="brief" style="flex:0 0 auto">Send</button>
      </div>
    </div>

    <div class="section">
      <h3>Report to government</h3>
      <div class="row report-btns">
        <button class="r-road" data-kind="road_hazard">🚧 Road blocked</button>
        <button class="r-sos" data-kind="rescue_needed">🆘 I'm trapped</button>
        <button class="r-seen" data-kind="rescue_seen">👁️ Saw someone</button>
      </div>
      <div id="reportMsg" class="muted" style="margin-top:6px"></div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    let current = "sunsari";
    let map, layer, meMarker, myLoc = null, lastResponseId = null;
    // Tracks the instruction id the user has already been briefed on.
    // undefined = not yet baselined (first poll sets it silently).
    let lastSeenInstructionId;
    // Detected language of the caller (BCP-47); keeps replies + briefings in it.
    let userLang = null;

    function initMap() {
      map = L.map("map").setView(AREA_CENTERS[current], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap",
      }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }

    function fillAreaSelect() {
      const sel = document.getElementById("areaSelect");
      sel.innerHTML = AREAS.map(a => `<option value="${a}">${AREA_LABELS[a]}</option>`).join("");
      sel.value = current;
      sel.onchange = () => {
        current = sel.value;
        lastSeenInstructionId = undefined; // rebaseline for the new area
        map.setView(AREA_CENTERS[current], 12);
        refresh();
      };
    }

    function renderBanner(status) {
      const b = document.getElementById("banner");
      const inst = status.instruction;
      if (!inst) {
        b.className = "banner b-none";
        b.innerHTML = `<div class="t">No official instruction yet</div>
          <div class="muted">Risk: ${status.summary.risk_level}. Stay alert; monitor updates.</div>`;
        return;
      }
      b.className = "banner b-" + inst.severity;
      let extra = "";
      if (inst.instruction_type === "evacuate") {
        if (inst.approved_route) extra += `Route: ${inst.approved_route.name}. `;
        if (inst.shelter) extra += `Shelter: ${inst.shelter.name}.`;
      }
      b.innerHTML = `<div class="t">${inst.instruction_type.toUpperCase()}</div>
        <div>${inst.emergency_message}</div>
        <div class="muted">${extra}</div>`;
    }

    function drawMap(mapData) {
      layer.clearLayers();
      if (myLoc) meMarker = L.marker([myLoc.lat, myLoc.lng], { icon: emojiIcon(MARKERS.me, 30) })
        .bindPopup("You are here").addTo(layer);
      if (mapData.shelter && mapData.shelter.location)
        L.marker([mapData.shelter.location.coordinates[1], mapData.shelter.location.coordinates[0]],
          { icon: emojiIcon(MARKERS.shelter) }).bindPopup("Shelter: " + mapData.shelter.name).addTo(layer);
      (mapData.hospitals || []).forEach(h => h.location &&
        L.marker([h.location.coordinates[1], h.location.coordinates[0]], { icon: emojiIcon(MARKERS.hospital) })
          .bindPopup("Hospital: " + h.name).addTo(layer));
      (mapData.closed_roads || []).forEach(r => r.geometry &&
        L.marker([r.geometry.coordinates[1], r.geometry.coordinates[0]], { icon: emojiIcon(MARKERS.closed_road) })
          .bindPopup("Closed: " + r.name).addTo(layer));
      if (mapData.approved_route && mapData.approved_route.geometry) {
        const coords = mapData.approved_route.geometry.coordinates.map(c => [c[1], c[0]]);
        L.polyline(coords, { color: "#22c55e", weight: 5 }).addTo(layer);
      }
      (mapData.reports || []).forEach(rep => {
        const c = rep.location.coordinates;
        L.marker([c[1], c[0]], { icon: emojiIcon(reportEmoji(rep.kind), 22) })
          .bindPopup(`${rep.kind}: ${rep.message}`).addTo(layer);
      });
    }

    // When the government publishes a new/changed instruction, the agent
    // automatically briefs the user on what changed and whether it affects them.
    async function autoBrief(prevId) {
      try {
        const data = await api("/api/public/update-briefing", {
          method: "POST",
          body: JSON.stringify({ area_id: current, previous_instruction_id: prevId, language: userLang || "en" }),
        });
        if (data.briefing) {
          addMsg("🏛️ Government update", data.briefing.text);
          lastResponseId = data.briefing.response_id;
          playTts({ kind: "assistant_response", response_id: data.briefing.response_id });
        }
      } catch (_) {}
    }

    async function refresh() {
      try {
        const status = await api(`/api/public/status/${current}`);
        renderBanner(status);
        const newId = status.instruction ? status.instruction.publication_id : null;
        if (lastSeenInstructionId === undefined) {
          lastSeenInstructionId = newId; // first poll: baseline silently
        } else if (newId && newId !== lastSeenInstructionId) {
          const prev = lastSeenInstructionId;
          lastSeenInstructionId = newId;
          autoBrief(prev); // a real government update arrived -> brief the user
        } else {
          lastSeenInstructionId = newId;
        }
        const mapData = await api(`/api/public/map/${current}`);
        drawMap(mapData);
      } catch (e) {
        document.getElementById("agentStatus").innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    // ---- Agent chat + voice ----
    function updateLangBadge() {
      const el = document.getElementById("langBadge");
      if (el) el.textContent = userLang ? "🌐 " + userLang : "🌐 auto";
    }

    function addMsg(who, txt) {
      const c = document.getElementById("chat");
      c.innerHTML += `<div class="msg"><div class="who">${who}</div><div class="txt">${txt}</div></div>`;
      c.scrollTop = c.scrollHeight;
    }

    async function playTts(payload) {
      try {
        const res = await fetch("/api/tts", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) return;
        const blob = await res.blob();
        new Audio(URL.createObjectURL(blob)).play();
      } catch (_) {}
    }

    // Make sure we have a location before a turn so the agent can geo-tag an
    // auto-report. Non-blocking if the user denies.
    async function ensureLoc() {
      if (myLoc) return myLoc;
      try { myLoc = await getLocation(); } catch (_) {}
      return myLoc;
    }

    function noteAutoReport(resp) {
      if (resp.report_filed) {
        addMsg("📍 Auto-reported to government",
          `${resp.report_kind} pin filed at your location.`);
        refresh();
      }
    }

    async function sendChat(question, who = "You") {
      addMsg(who, question);
      document.getElementById("agentStatus").textContent = "Agent thinking…";
      await ensureLoc();
      try {
        const body = { area_id: current, question };
        if (myLoc) { body.latitude = myLoc.lat; body.longitude = myLoc.lng; }
        if (userLang) body.language = userLang;
        const r = await api("/api/chat", { method: "POST", body: JSON.stringify(body) });
        lastResponseId = r.response_id;
        userLang = r.language || userLang;
        updateLangBadge();
        addMsg("Agent (" + r.mode + ")", r.text);
        document.getElementById("agentStatus").textContent = "";
        noteAutoReport(r);
        playTts({ kind: "assistant_response", response_id: r.response_id });
      } catch (e) {
        document.getElementById("agentStatus").innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    document.getElementById("sendBtn").onclick = () => {
      const q = document.getElementById("q");
      if (q.value.trim()) { sendChat(q.value.trim()); q.value = ""; }
    };
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("sendBtn").click(); });

    document.getElementById("briefBtn").onclick = () =>
      sendChat("Summarize the situation and my next actions.", "You (briefing)");

    // Voice: tap to record, tap to stop -> /api/voice (STT + agent) -> TTS.
    let mediaRecorder, chunks = [];
    document.getElementById("callBtn").onclick = async () => {
      const btn = document.getElementById("callBtn");
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          btn.classList.remove("recording"); btn.textContent = "🎙️ Tap to talk";
          const blob = new Blob(chunks, { type: "audio/webm" });
          await ensureLoc();
          const fd = new FormData();
          fd.append("area_id", current);
          fd.append("audio", blob, "clip.webm");
          if (myLoc) { fd.append("latitude", myLoc.lat); fd.append("longitude", myLoc.lng); }
          if (userLang) fd.append("language", userLang);
          document.getElementById("agentStatus").textContent = "Transcribing…";
          try {
            const res = await fetch("/api/voice", { method: "POST", body: fd });
            const data = await res.json();
            if (!res.ok) throw new Error(JSON.stringify(data));
            addMsg("You (voice)", data.transcript || "(no speech detected)");
            lastResponseId = data.response.response_id;
            userLang = data.response.language || userLang;
            updateLangBadge();
            addMsg("Agent (" + data.response.mode + ")", data.response.text);
            document.getElementById("agentStatus").textContent = "";
            noteAutoReport(data.response);
            playTts({ kind: "assistant_response", response_id: data.response.response_id });
          } catch (e) {
            document.getElementById("agentStatus").innerHTML = `<span class="err">${e.message}</span>`;
          }
        };
        mediaRecorder.start();
        btn.classList.add("recording"); btn.textContent = "⏹️ Tap to stop";
      } catch (e) {
        document.getElementById("agentStatus").innerHTML = `<span class="err">Mic error: ${e.message}</span>`;
      }
    };

    // ---- Reports ----
    document.querySelectorAll(".report-btns button").forEach(btn => {
      btn.onclick = async () => {
        const kind = btn.dataset.kind;
        const out = document.getElementById("reportMsg");
        out.textContent = "Getting your location…";
        let loc;
        try { loc = await getLocation(); myLoc = loc; }
        catch (e) { out.innerHTML = `<span class="err">Location needed to report (denied).</span>`; return; }
        const messages = {
          road_hazard: "Road in front of me is blocked by floodwater.",
          rescue_needed: "I am trapped and need rescue.",
          rescue_seen: "I see someone stuck and needing help nearby.",
        };
        try {
          const r = await api("/api/public/reports", {
            method: "POST",
            body: JSON.stringify({
              area_id: current, kind, message: messages[kind],
              location: { type: "Point", coordinates: [loc.lng, loc.lat] },
              reported_at: new Date().toISOString(),
              idempotency_key: deviceId() + ":" + kind + ":" + Date.now(),
            }),
          });
          out.innerHTML = `<span class="ok">Reported (${r.verification_state}). Government can see it now.</span>`;
          refresh();
        } catch (e) { out.innerHTML = `<span class="err">${e.message}</span>`; }
      };
    });

    (async function () {
      fillAreaSelect();
      initMap();
      await refresh();
      setInterval(refresh, 3000);
      // Try to drop a "you are here" pin without blocking.
      getLocation().then(l => { myLoc = l; map.setView([l.lat, l.lng], 13); refresh(); }).catch(() => {});
    })();
  </script>
</body>
</html>
